name: Multilingual release checks

on:
  pull_request:
    paths:
      - 'app.py'
      - 'adaptivecare.py'
      - 'mamacare.py'
      - 'babycare.py'
      - 'find_care.py'
      - 'localization/**'
      - 'locales/**'
      - 'tests/test_localization_integrity.py'
      - 'scripts/audit_multilingual_release.py'
      - '.github/workflows/multilingual-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  localization:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run localization integrity tests
        run: python -m unittest discover -s tests -p 'test_localization_integrity.py' -v
      - name: Run multilingual source audit
        run: python scripts/audit_multilingual_release.py
      - name: Run coverage inventory
        run: python scripts/localization_coverage.py
