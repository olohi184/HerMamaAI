<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#61206e"><meta name="description" content="HerMamaAI maternal and child wellness research prototype.">
<title>HerMamaAI | Every Mother Deserves Continued Care</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="../HerMamaAI%20Mother%20and%20Baby%20Emblem.png">
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#51235f;background:#fff7fd}
*{box-sizing:border-box}body{margin:0}header{height:48px;display:flex;align-items:center;justify-content:center;padding:6px 15px;background:linear-gradient(110deg,#fff5fc,#f0d9f5);border-bottom:1px solid #e9cfe8}
header strong{font-size:1rem;letter-spacing:.02em}
/* Keep Streamlit's embedded footer outside the visible mobile app viewport.
   This is a presentation-only crop, not a change to the Streamlit backend. */
main{height:calc(100dvh - 48px);min-height:320px;overflow:hidden;position:relative}
iframe{display:block;width:100%;height:calc(100% + 68px);border:0;background:#fff7fd}
@media(min-width:900px){iframe{height:calc(100% + 58px)}}
.fallback{padding:12px;text-align:center;font-size:.83rem}
.fallback a{color:#792b83;font-weight:700}
</style>
</head>
<body>
<header><strong>HerMamaAI · Maternal &amp; Child Wellness</strong></header>
<main><iframe title="HerMamaAI maternal and child wellness prototype" src="https://hermamaai.streamlit.app/?embed=true" allow="clipboard-write" loading="eager"></iframe></main>
<noscript><p class="fallback">JavaScript is needed to use the interactive prototype. <a href="https://hermamaai.streamlit.app">Open HerMamaAI</a>.</p></noscript>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}</script>
</body></html>
